<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Iam Ilia - A portfolio showcasing my projects, skills, and experience as a software developer and tech enthusiast." />
        <meta name="keywords" content="Ilia, Software Developer, Portfolio, React, TypeScript, GitHub, Projects, Web Development, Fivem Development, Lua, Fivem Developer, Ilia Lotfi, ایلیا لطفی,"  />
        <meta name="author" content="Ilia" />
        <meta name="robots" content="index, follow" />

        <!--
          NOTE: every og:* / twitter:* / <title> / description tag below is
          replaced at request time by the Express server (my-express-app,
          src/lib/html-meta.ts) so each route gets its own link preview.
          What's here is only the fallback for `vite dev` and for any host
          that serves this file statically. Edit the real per-route values in
          my-express-app/src/config/meta.ts.
        -->

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Iam Ilia - Software Developer Portfolio" />
        <meta property="og:description" content="Explore my projects, skills, and experience as a software developer and tech enthusiast." />
        <meta property="og:image" content="https://iamilia.ir/og-home.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:url" content="https://iamilia.ir" />
        <meta property="og:site_name" content="Iam Ilia" />

        <!-- Discord Embed / browser chrome -->
        <meta property="theme-color" content="#6d5bd0" />
        <!-- rewritten before first paint by the inline script below -->
        <meta name="theme-color" content="#faf7f2" />
        <meta name="color-scheme" content="light dark" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Iam Ilia - Software Developer Portfolio" />
        <meta name="twitter:description" content="Explore my projects, skills, and experience as a software developer and tech enthusiast." />
        <meta name="twitter:image" content="https://iamilia.ir/og-home.png" />
        <meta name="twitter:site" content="@org_ilia" />
        <meta name="twitter:creator" content="@org_ilia" />
        <meta name="twitter:url" content="https://iamilia.ir" />

        <!-- Telegram Preview -->
        <meta name="telegram:channel" content="@im_1lia" />

        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <!--
          The GitHub API is proxied through this same origin (see /_gh), so
          there is nothing to preconnect there. The avatar is still loaded
          straight from GitHub's image host, and that one is worth warming.
        -->
        <link rel="preconnect" href="https://avatars.githubusercontent.com" />

        <!--
          Typefaces are self-hosted via Fontsource and bundled by Vite (see
          src/style.css) rather than pulled from a font CDN — no third-party
          request on first paint, and nothing to fail on a slow network.
        -->
        <link href="/src/style.css" rel="stylesheet">
        <title>Iam Ilia - Software Developer Portfolio</title>

        <!--
          Resolve the theme before first paint so there is no flash. The
          default is the operating system's own preference; `theme` in
          localStorage only exists once the visitor has overridden it by
          hand. Keep these two hex values in step with --bg in src/style.css.
        -->
        <script>
            (function () {
                var LIGHT = '#faf7f2';
                var DARK = '#0b0f1a';
                var dark = false;
                try {
                    var saved = localStorage.getItem('theme');
                    dark =
                        saved === 'dark' ||
                        (saved !== 'light' &&
                            window.matchMedia('(prefers-color-scheme: dark)')
                                .matches);
                } catch (e) {
                    /* localStorage blocked — fall back to the media query */
                    dark =
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                var root = document.documentElement;
                root.classList.toggle('dark', dark);
                root.style.colorScheme = dark ? 'dark' : 'light';
                root.style.backgroundColor = dark ? DARK : LIGHT;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? DARK : LIGHT);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
